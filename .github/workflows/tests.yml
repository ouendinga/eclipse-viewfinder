name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Un test ejecuta con node el JavaScript que se publica, en vez de
      # reimplementarlo en Python: una copia aprobaría aunque el navegador
      # hiciera otra cosa.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install -r requirements.txt

      # Los tests que necesitan el modelo de elevación se saltan solos: esos
      # datos son gigas y no están en el repo. Aquí corre todo lo demás, que es
      # la geometría del eclipse y las reglas de presentación.
      - run: python -m unittest discover -s tests -v
